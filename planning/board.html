<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Кейс 02 — доска</title><style>
body{font:16px/1.5 system-ui;background:#f3f6f8;color:#172a3a;margin:28px}h1{font-size:27px;margin-bottom:6px}.notice{max-width:1000px}button,select{font:inherit;padding:7px;margin:4px;border:1px solid #9baebb;border-radius:5px;background:white}.board{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;margin-top:22px}.column{min-width:280px;width:300px;background:#e5edf2;border-radius:10px;padding:12px}.card{background:white;border:1px solid #cad6de;padding:14px;margin:12px 0;border-radius:8px}.card h3{font-size:17px}.small{font-size:13px;color:#42576b}.blocked{border-left:5px solid #af6621}.alert{font-weight:600;min-height:28px}.tag{display:inline-block;padding:2px 7px;background:#eef3f7;border-radius:4px;font-size:13px}a{color:#17517a}</style>
<h1>Кейс 02 · план разработки</h1><p class="notice">Гипотетическая команда. Начальные статусы — план, не выполненные спринты. Документы и имитатор не означают готовность функций приложения.</p><p class="small">Изменения сохраняются только в этом браузере. GitHub не обновляется. Выгрузка позволяет сохранить отдельный сценарий работы с доской.</p><button id="reset">Сбросить локальные изменения</button><button id="export">Выгрузить состояние JSON</button><div id="alert" class="alert" role="status"></div><main class="board" id="board"></main><script>
const initial={"notice": "План гипотетической разработки. Статусы относятся к функциям будущего приложения, не к готовности документов или имитатора.", "columns": ["Требует уточнения", "Готово к обсуждению", "В работе", "Проверка", "Завершено"], "wip": {"В работе": 2, "Проверка": 2}, "items": [{"id": "US-01", "title": "Записать фактически выполненную ходьбу", "sprint": 1, "priority": 1, "status": "Готово к обсуждению", "requirements": ["ФТ-11", "ФТ-16"], "acceptance": ["Сумма отрезков совпадает с длительностью", "После перезапуска видна подтверждённая запись"], "blocked": false, "reason": "", "artifact": "docs/04-local-data.md"}, {"id": "US-02", "title": "Объяснить расчёт и сохранить его версию", "sprint": 1, "priority": 2, "status": "Готово к обсуждению", "requirements": ["ФТ-12", "НТ-05"], "acceptance": ["Сохранены исходные данные и версия метода", "Изменение профиля не меняет старый результат"], "blocked": false, "reason": "", "artifact": "docs/04-local-data.md"}, {"id": "US-03", "title": "Показать связь прогноза с базовой 3D-моделью", "sprint": 1, "priority": 3, "status": "Требует уточнения", "requirements": ["ФТ-14", "ПП-04"], "acceptance": ["Предполагаемая форма отделена от текущей", "Модель не подменяет численные результаты расчёта"], "blocked": true, "reason": "Нужно согласовать состав внутреннего сообщения и границы прогноза", "artifact": "docs/04-local-data.md"}, {"id": "US-04", "title": "Зарегистрироваться и войти на двух устройствах", "sprint": 2, "priority": 4, "status": "Готово к обсуждению", "requirements": ["ФТ-01", "ФТ-02"], "acceptance": ["Код одноразовый и ограничен по сроку", "Входы относятся к одному владельцу без передачи дневника"], "blocked": false, "reason": "", "artifact": "contracts/openapi.json"}, {"id": "US-05", "title": "Выбрать тариф и начать оплату", "sprint": 2, "priority": 5, "status": "Требует уточнения", "requirements": ["ФТ-03", "ФТ-04"], "acceptance": ["Цена определяется сервером", "Повтор запроса не создаёт второй платёж"], "blocked": true, "reason": "ВП-01/02: поставщик, страна и коммерческий тариф не выбраны", "artifact": "docs/05-payments.md"}, {"id": "US-06", "title": "Получить оплаченный доступ после подтверждения", "sprint": 2, "priority": 6, "status": "Готово к обсуждению", "requirements": ["ФТ-05", "ФТ-06"], "acceptance": ["Период возникает после доверенной сверки", "Повторы уведомления не продлевают период дважды"], "blocked": false, "reason": "", "artifact": "docs/05-payments.md"}, {"id": "US-07", "title": "Восстановить исход оплаты после потери ответа", "sprint": 3, "priority": 7, "status": "Готово к обсуждению", "requirements": ["ФТ-07", "ФТ-15"], "acceptance": ["Неизвестный исход не считается отменой", "Повторная сверка восстанавливает доступ без новой оплаты"], "blocked": false, "reason": "", "artifact": "tests/test_api.py"}, {"id": "US-08", "title": "Сохранить дневник после истечения или возврата", "sprint": 3, "priority": 8, "status": "Готово к обсуждению", "requirements": ["ФТ-08", "ФТ-09", "ПП-06"], "acceptance": ["Возврат отзывает нужный период", "Чтение и выгрузка дневника не блокируются"], "blocked": false, "reason": "", "artifact": "docs/05-payments.md"}, {"id": "US-09", "title": "Проверить защиту аккаунта и запрет передачи фото", "sprint": 3, "priority": 9, "status": "Готово к обсуждению", "requirements": ["ФТ-10", "ФТ-13", "НТ-01"], "acceptance": ["Чужой платёж недоступен", "Фото и тренировочные данные не передаются в запросах или аналитике"], "blocked": false, "reason": "", "artifact": "docs/03-architecture.md"}, {"id": "US-10", "title": "Спроектировать автономное платное разрешение", "sprint": 3, "priority": 10, "status": "Требует уточнения", "requirements": ["ФТ-08"], "acceptance": ["Определены срок, подпись и обработка неверных часов", "Отзыв без сети не обещает мгновенного эффекта"], "blocked": true, "reason": "ВП-07: политика автономного доступа не утверждена", "artifact": "docs/03-architecture.md"}, {"id": "US-11", "title": "Подготовить проверку точности расчётов", "sprint": null, "priority": 11, "status": "Требует уточнения", "requirements": ["НТ-05"], "acceptance": ["Согласованы эталон и отдельная проверочная выборка", "Критерий точности задан до оценки результата"], "blocked": true, "reason": "Нет эталонных данных и согласованной метрики", "artifact": "docs/04-local-data.md"}, {"id": "US-12", "title": "Разрешаемая синхронизация и нейросетевой прогноз", "sprint": null, "priority": 12, "status": "Требует уточнения", "requirements": ["ПП-01", "ПП-02", "ФТ-14"], "acceptance": ["Фото остаются локальными", "Согласованы категории данных, отзыв разрешения и оценка качества прогноза"], "blocked": true, "reason": "Развитие за пределами первой версии; не объединять со входом и оплатой", "artifact": "docs/08-decisions.md"}]};const key='case02-kanban-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch(e){data=structuredClone(initial)}
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){document.querySelector('#alert').textContent='Браузер не сохранил изменения. Используйте выгрузку.'}}
function render(){const root=document.querySelector('#board');root.replaceChildren();for(const col of data.columns){const items=data.items.filter(x=>x.status===col);const wrap=el('section',null,'column');wrap.append(el('h2',col),el('p',`${items.length} карточек${data.wip[col]?' · предел '+data.wip[col]:''}`,'small'));for(const item of items){const c=el('article',null,'card'+(item.blocked?' blocked':''));c.append(el('span',item.id,'tag'),el('h3',item.title),el('p','Спринт: '+(item.sprint||'позднее')+' · приоритет '+item.priority,'small'),el('p',item.requirements.join(', '),'small'));for(const a of item.acceptance)c.append(el('p','Условие: '+a,'small'));if(item.blocked)c.append(el('p','Препятствие: '+item.reason,'small'));const select=el('select');select.setAttribute('aria-label','Состояние '+item.id);for(const target of data.columns){const opt=el('option',target);opt.value=target;opt.selected=target===item.status;select.append(opt)}select.onchange=()=>{const target=select.value;const count=data.items.filter(x=>x.status===target).length;if(data.wip[target]&&count>=data.wip[target]){document.querySelector('#alert').textContent='Предел незавершённой работы достигнут. Сначала завершите начатое.';render();return}if(target==='Завершено'&&!confirm('Это только ваш сценарий доски. Условия приёмки действительно выполнены?')){render();return}item.status=target;document.querySelector('#alert').textContent='Сохранено локально; репозиторий не менялся.';save();render()};c.append(select);wrap.append(c)}root.append(wrap)}}
document.querySelector('#reset').onclick=()=>{if(confirm('Сбросить только локальные изменения доски?')){data=structuredClone(initial);save();render()}};
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download='case02-board-scenario.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();</script></html>
